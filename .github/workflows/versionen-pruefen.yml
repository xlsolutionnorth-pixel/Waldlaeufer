name: Versionen prüfen
on:
  push:
    branches: [playstore]
    paths: ['.github/workflows/versionen-pruefen.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm pack @capacitor-community/admob@8.3.0 >/dev/null 2>&1 && tar -xzf capacitor-community-admob-*.tgz
          cd package/dist/esm
          grep -rhnE "(BOTTOM_CENTER|TOP_CENTER|ADAPTIVE_BANNER|BANNER =|REQUIRED|OBTAINED|NOT_REQUIRED|UNKNOWN|SizeChanged|FailedToLoad|Dismissed|DEBUG_GEOGRAPHY_EEA|EEA =)" --include=*.js . | head -30
          echo "== BannerAdOptions"; grep -rh -A40 "interface BannerAdOptions" --include=*.d.ts . | grep -E "^\s+[a-zA-Z]+\??:" | head -12
          echo "== AdOptions"; grep -rh -A40 "interface AdOptions" --include=*.d.ts . | grep -E "^\s+[a-zA-Z]+\??:" | head -10
          echo "== ConsentRequest"; grep -rh -A30 "interface AdmobConsentRequestOptions" --include=*.d.ts . | grep -E "^\s+[a-zA-Z]+\??:" | head -8
          echo "== ConsentInfo"; grep -rh -A30 "interface AdmobConsentInfo" --include=*.d.ts . | grep -E "^\s+[a-zA-Z]+\??:" | head -8
          echo "== Init"; grep -rh -A40 "interface AdMobInitializationOptions" --include=*.d.ts . | grep -E "^\s+[a-zA-Z]+\??:" | head -8
          echo "== BannerSize"; grep -rh -A12 "interface AdMobBannerSize" --include=*.d.ts . | grep -E "^\s+[a-zA-Z]+\??:" | head -4
