name: Versionen prüfen
on:
  push:
    branches: [playstore]
    paths: ['.github/workflows/versionen-pruefen.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm pack @capacitor-community/admob@8.3.0 >/dev/null 2>&1 && tar -xzf capacitor-community-admob-*.tgz
          R=package/README.md
          echo "== SETUP"; sed -n '60,135p' $R
          echo "== API"; grep -nE "^### |=> Promise" $R | sed -n '1,120p'
          echo "== INTERFACES"; awk '/#### BannerAdOptions/,/#### /' $R | head -30; awk '/#### AdOptions/,/#### /' $R | head -25; awk '/#### AdmobConsentRequestOptions/,/#### /' $R | head -20; awk '/#### AdMobInitializationOptions/,/#### /' $R | head -20
          echo "== ENUMS"; awk '/#### BannerAdPluginEvents/,/#### /' $R | head -20; awk '/#### BannerAdPosition/,/#### /' $R | head -12; awk '/#### AdmobConsentStatus/,/#### /' $R | head -12
          echo "== ANDROID MANIFEST in plugin"; cat package/android/src/main/AndroidManifest.xml
          echo "== variables"; grep -rn "playServicesAdsVersion\|playServicesAds\|ump" package/android/build.gradle | head
