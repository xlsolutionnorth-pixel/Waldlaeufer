name: Versionen prüfen
on:
  push:
    branches: [playstore]
    paths: ['.github/workflows/versionen-pruefen.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm pack @capacitor-community/admob@8.3.0 >/dev/null 2>&1 && tar -xzf capacitor-community-admob-*.tgz
          cd package
          echo "== Events (JS)"; grep -rhoE "'interstitialAd[A-Za-z]+'|\"interstitialAd[A-Za-z]+\"|'bannerAd[A-Za-z]+'" dist/esm | sort -u
          echo "== Android interstitial"; f=$(grep -rl "showInterstitial" android/src | head -3); echo "$f"
          for x in $f; do grep -nE "resolve|notifyListeners|onAdDismissed|onAdShowed|FailedToShow|Dismissed" "$x" | head -30; done
          echo "== Banner height"; grep -rnE "SizeChanged|getHeightInPixels|getHeight\(|density|height" android/src --include=*.java --include=*.kt | grep -i -E "banner|size|height" | head -20
