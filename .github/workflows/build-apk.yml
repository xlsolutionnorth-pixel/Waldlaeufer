name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Das Android-SDK ist auf GitHub-Servern bereits vorinstalliert.
      # Hier werden nur die Lizenzen bestätigt (Fehler werden ignoriert).
      - name: Android-SDK vorbereiten
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          # Berechtigungen, Benachrichtigungstexte und eigenes Modul (Musik leiser bei Ansagen) einbauen
          python3 native/patch_android.py
          cat android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK kompilieren
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Waldlaeufer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Waldlaeufer-APK
          path: Waldlaeufer.apk
