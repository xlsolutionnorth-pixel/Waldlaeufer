name: APK bauen

on:
  push:
    # Reine Server- oder Dokument-Änderungen bauen keine neue App
    paths-ignore:
      - 'server/**'
      - '.github/workflows/server-deploy.yml'
      - '.github/workflows/quota-watch.yml'
      - '*.md'
  workflow_dispatch:
    inputs:
      variante:
        description: 'Welche App bauen? normal = ohne Schlüssel · tester = „Waldläufer Tester“ mit eingebautem Schlüssel und fester Signatur'
        type: choice
        options: [normal, tester]
        default: normal

# Schreibrecht, damit die fertige APK als Release veröffentlicht werden kann
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Das Android-SDK ist auf GitHub-Servern bereits vorinstalliert.
      # Hier werden nur die Lizenzen bestätigt (Fehler werden ignoriert).
      - name: Android-SDK vorbereiten
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - name: Abhängigkeiten installieren
        run: npm install

      # Nur für die Tester-Version: eigener Name und eigene Kennung (läuft neben der normalen App),
      # Schlüssel aus dem Secret TESTER_ORS_API_KEY einbauen (eigenes openrouteservice-Konto nur für Tester –
      # lässt sich dort jederzeit löschen, dann funktioniert die Suche in allen Tester-Apps nicht mehr). Die normale App bleibt ohne Schlüssel.
      - name: Tester-Version vorbereiten
        if: github.event.inputs.variante == 'tester'
        env:
          ORS_API_KEY: ${{ secrets.TESTER_ORS_API_KEY }}
          KS: ${{ secrets.TESTER_KEYSTORE }}
          KSPW: ${{ secrets.TESTER_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$ORS_API_KEY" ] || missing="$missing TESTER_ORS_API_KEY"
          [ -n "$KS" ] || missing="$missing TESTER_KEYSTORE"
          [ -n "$KSPW" ] || missing="$missing TESTER_KEYSTORE_PASSWORD"
          [ -z "$missing" ] || { echo "::error::Für die Tester-Version fehlen die Secrets:$missing"; exit 1; }
          python3 - <<'PY2'
          import json, os
          c = json.load(open("capacitor.config.json"))
          c["appId"] = "de.waldlaeufer.tester"; c["appName"] = "Waldläufer Tester"
          json.dump(c, open("capacitor.config.json", "w"), ensure_ascii=False, indent=2)
          p = "www/index.html"; s = open(p, encoding="utf-8").read()
          a = 'const BUILTIN_KEY = "";'
          assert s.count(a) == 1, "Platzhalter für den Schlüssel nicht gefunden"
          s = s.replace(a, "const BUILTIN_KEY = " + json.dumps(os.environ["ORS_API_KEY"].strip()) + ";")
          open(p, "w", encoding="utf-8").write(s)
          print("Tester-Version: Name und Kennung gesetzt, Schlüssel eingebaut")
          PY2

      - name: Android-Projekt erzeugen
        env:
          # Eigene AdMob-App-ID: GitHub → Settings → Secrets and variables → Actions → Variables → ADMOB_APP_ID
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          npx cap add android
          # Berechtigungen, Benachrichtigungstexte und eigenes Modul (Musik leiser bei Ansagen) einbauen
          python3 native/patch_android.py
          cat android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK kompilieren
        working-directory: android
        run: |
          chmod +x gradlew
          # Gradle-Download absichern: Der offizielle Server leitet zu GitHub-Releases weiter, die zeitweise
          # mit 504 antworten. Dann wird ein Spiegel-Server genutzt – Gradle prüft die Datei dabei gegen
          # die OFFIZIELLE Prüfsumme (distributionSha256Sum), eine veränderte Datei wird abgelehnt.
          P=gradle/wrapper/gradle-wrapper.properties
          V=$(sed -nE 's#^distributionUrl=.*gradle-([0-9.]+)-(all|bin)\.zip#\1#p' $P)
          SUM=$(curl -sfL --retry 3 "https://services.gradle.org/distributions/gradle-$V-bin.zip.sha256")
          [ ${#SUM} -eq 64 ] || { echo "Offizielle Prüfsumme nicht erhältlich"; exit 1; }
          URL=""
          for u in "https://services.gradle.org/distributions/gradle-$V-bin.zip" \
                   "https://repo.huaweicloud.com/gradle/gradle-$V-bin.zip" \
                   "https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip"; do
            if curl -sfIL --max-time 30 "$u" >/dev/null; then URL="$u"; break; fi
          done
          [ -n "$URL" ] || { echo "Keine Gradle-Quelle erreichbar"; exit 1; }
          sed -i -E "s#^distributionUrl=.*#distributionUrl=${URL//:/\\\\:}#" $P
          grep -q '^distributionSha256Sum=' $P && sed -i "s#^distributionSha256Sum=.*#distributionSha256Sum=$SUM#" $P || echo "distributionSha256Sum=$SUM" >> $P
          echo "Gradle $V von: $URL"
          # Bibliotheken zuerst von Googles offiziellem Maven-Central-Spiegel laden: Maven Central selbst leitet
          # manche Dateien (z. B. den Kotlin-Compiler) zu GitHub-Releases weiter, die zeitweise mit 504 antworten.
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/central-spiegel.gradle <<'GRADLE'
          def SPIEGEL = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def vorne = { handler ->
              def r = handler.maven { url SPIEGEL; name 'MavenCentralGoogleSpiegel' }
              handler.remove(r); handler.addFirst(r)
          }
          allprojects { p ->
              vorne(p.repositories)
              vorne(p.buildscript.repositories)
          }
          settingsEvaluated { st -> vorne(st.pluginManagement.repositories) }
          GRADLE
          sed -i 's/^          //' ~/.gradle/init.d/central-spiegel.gradle
          cat $P
          TASK=assembleDebug; [ "${{ github.event.inputs.variante }}" = "tester" ] && TASK=assembleRelease
          for i in 1 2 3; do ./gradlew $TASK --no-daemon && break; echo "Versuch $i fehlgeschlagen – neuer Versuch in 20 s"; sleep 20; [ $i = 3 ] && exit 1; done

      - name: APK umbenennen
        if: github.event.inputs.variante != 'tester'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Waldlaeufer.apk

      # Tester-Version: mit dem festen eigenen Schlüssel signieren (gleicher Schlüssel bei jedem Bau →
      # Updates lassen sich einfach drüberinstallieren; später auch als Upload-Schlüssel für Google Play nutzbar)
      - name: Tester-APK signieren
        if: github.event.inputs.variante == 'tester'
        env:
          KS: ${{ secrets.TESTER_KEYSTORE }}
          KSPW: ${{ secrets.TESTER_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > tester.keystore
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks tester.keystore --ks-pass env:KSPW --ks-key-alias waldlaeufer --out Waldlaeufer-Tester.apk aligned.apk
          "$BT/apksigner" verify --print-certs Waldlaeufer-Tester.apk | grep -i "SHA-256" | head -1
          rm -f tester.keystore aligned.apk

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.variante != 'tester'
        continue-on-error: true   # fällt der Artefakt-Dienst von GitHub aus, wird die APK trotzdem als Release veröffentlicht
        with:
          name: Waldlaeufer-APK
          path: Waldlaeufer.apk

      # Hauptzweig: APK als Release ("latest") veröffentlichen.
      # Fester Download-Link: https://github.com/<konto>/<repo>/releases/latest/download/Waldlaeufer.apk
      # Andere Zweige: als Vorabversion (Pre-release) – ändert den festen Link nicht.
      # Tester-Version enthält den Schlüssel → NICHT öffentlich, nur als Entwurf (nur für dich sichtbar)
      - name: Tester-APK als privaten Entwurf ablegen
        if: github.event.inputs.variante == 'tester'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "tester-${VERSION}-build${{ github.run_number }}" Waldlaeufer-Tester.apk \
            --title "Waldläufer Tester ${VERSION} (Build ${{ github.run_number }}) – mit Schlüssel, nicht veröffentlichen" \
            --notes "Enthält den openrouteservice-Schlüssel. Nur gezielt an Tester weitergeben." \
            --draft --target "${GITHUB_SHA}"

      - name: APK als Release veröffentlichen
        if: github.event.inputs.variante != 'tester'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="${GITHUB_REF_NAME//\//-}"
          if [ "$BRANCH" = "main" ]; then
            gh release create "v${VERSION}-build${{ github.run_number }}" Waldlaeufer.apk \
              --title "Waldläufer ${VERSION} (Build ${{ github.run_number }})" \
              --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}." --latest
          else
            gh release create "test-${BRANCH}-build${{ github.run_number }}" Waldlaeufer.apk \
              --title "Test ${BRANCH}: Waldläufer ${VERSION} (Build ${{ github.run_number }})" \
              --notes "Testversion vom Zweig ${BRANCH}, Commit ${GITHUB_SHA::7}. Nicht für den Alltag." \
              --prerelease --target "${GITHUB_SHA}"
          fi
