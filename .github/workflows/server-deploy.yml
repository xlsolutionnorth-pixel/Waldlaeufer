name: Server einrichten

# Richtet den Waldläufer-Vermittlungs-Server bei Cloudflare ein bzw. aktualisiert ihn.
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   – Cloudflare-API-Token (Vorlage „Edit Cloudflare Workers“)
#   CLOUDFLARE_ACCOUNT_ID  – Cloudflare-Konto-ID
#   ORS_API_KEY            – dein openrouteservice-Schlüssel (bleibt auf dem Server, nie in der App)

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server testen
        run: node --test server/test/*.test.mjs

      - name: Secrets vorhanden?
        id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.ORS_API_KEY }}
        run: |
          missing=""
          [ -n "$T" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$A" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$K" ] || missing="$missing ORS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Server wird noch nicht eingerichtet – es fehlen die Secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bei Cloudflare einrichten
        if: steps.check.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            ORS_API_KEY
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}

      - name: Server prüfen
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Server-Adresse: $URL"
          sleep 5
          curl -sS --max-time 20 "$URL/health"; echo
          echo "--- Testsuche (Ort) ---"
          curl -sS --max-time 20 -H "X-Install-Id: github-actions-check" "$URL/geocode/search?text=Berlin&size=1" | head -c 300; echo
