name: Gradle-Quellen prüfen
on:
  push:
    branches: [playstore]
    paths: ['.github/workflows/gradle-quellen.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=gradle-8.14.3-bin.zip
          for u in \
            https://services.gradle.org/distributions/$F \
            https://services.gradle.org/distributions/$F.sha256 \
            https://downloads.gradle.org/distributions/$F \
            https://github.com/gradle/gradle-distributions/releases/download/v8.14.3/$F \
            https://mirrors.cloud.tencent.com/gradle/$F \
            https://mirrors.aliyun.com/gradle/distributions/v8.14.3/$F \
            https://repo.huaweicloud.com/gradle/$F ; do
            printf "%-90s " "$u"; curl -sL -o /tmp/x -w "%{http_code} %{size_download}B %{time_total}s\n" --max-time 120 "$u" || echo fail
            [ -s /tmp/x ] && sha256sum /tmp/x | cut -c1-64
          done
          echo "== vorinstalliertes Gradle:"; which gradle && gradle --version 2>/dev/null | head -3; ls /opt/gradle* /usr/share/gradle* 2>/dev/null | head
          echo "== Gradle-Cache:"; ls ~/.gradle/wrapper/dists 2>/dev/null
